name: Dev Build

on:
  push:
  pull_request:

jobs:
  dev:
    runs-on: ubuntu-26.04

    steps:
      - uses: actions/checkout@v7

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust
        uses: Swatinem/rust-cache@v2

      - name: Install Just
        uses: extractions/setup-just@v4

      - name: Install Linux dependencies
        run: |
          sudo apt update
          sudo apt install -y \
            pkg-config \
            libavcodec-dev \
            libavformat-dev \
            libavutil-dev \
            libavfilter-dev \
            libswscale-dev \
            libva-dev \
            libva-drm2 \
            libpipewire-0.3-dev \
            libspa-0.2-dev \
            libavdevice-dev \
            libswresample-dev \
            libclang-dev

      - name: Format check
        run: cargo fmt --check

      - name: Build
        run: just linux-dev

      - name: Upload Artifact
        uses: actions/upload-artifact@v7
        with:
          name: frostclip-dev-linux
          path: build/frostclip-linux-dev
          retention-days: 7
