name: Dev Build

on:
  push:
  pull_request:

jobs:
  linux:
    runs-on: ubuntu-26.04

    steps:
      - uses: actions/checkout@v7

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install ffmpeg 
        uses: AnimMouse/setup-ffmpeg@v1

      - name: Cache Rust
        uses: Swatinem/rust-cache@v2

      - name: Install Linux dependencies
        run: |
          sudo apt update
          sudo apt install -y \
            pkg-config \
            libpipewire-0.3-dev \
            libspa-0.2-dev \
            libva-drm2 \
            libclang-dev

      - name: Format check
        run: cargo fmt --check

      - name: Build
        run: cargo b

      - name: Upload Artifact
        uses: actions/upload-artifact@v7
        with:
          name: frostclip-dev-linux
          path: target/debug/frostclip
          retention-days: 7
  macos:
    runs-on: macos-latest

    steps:
      - uses: actions/checkout@v7

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install ffmpeg 
        uses: AnimMouse/setup-ffmpeg@v1

      - name: Cache Rust
        uses: Swatinem/rust-cache@v2

      - name: Format check
        run: cargo fmt --check

      - name: Build
        run: cargo b

      - name: Upload Artifact
        uses: actions/upload-artifact@v7
        with:
          name: frostclip-dev-macos
          path: target/debug/frostclip
          retention-days: 7
