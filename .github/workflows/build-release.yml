name: Release Build

on:
  push:
    tags:
      - "*"

jobs:
  release:
    runs-on: ubuntu-26.04

    steps:
      - uses: actions/checkout@v7

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust
        uses: Swatinem/rust-cache@v2

      - name: Install Just
        uses: extractions/setup-just@v4

      - name: Install Linux dependencies
        run: |
          sudo apt update
          sudo apt install -y \
            pkg-config \
            libavcodec-dev \
            libavformat-dev \
            libavutil-dev \
            libavfilter-dev \
            libswscale-dev \
            libva-dev \
            libva-drm2 \
            libpipewire-0.3-dev \
            libspa-0.2-dev \
            libclang-dev \
            libavdevice-dev \
            libswresample-dev \
            upx

      - name: Build
        run: just linux-release

      - name: Upload Artifact
        uses: actions/upload-artifact@v7
        with:
          name: frostclip-linux
          path: build/frostclip-linux
          retention-days: 30

      - name: Upload Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v3
        with:
          files: build/frostclip-linux
          draft: true
