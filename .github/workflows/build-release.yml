name: Release Build

on:
  push:
    branches:
      - "**"
    tags:
      - "*"
  pull_request:
    branches:
      - "**"

jobs:
  linux:
    runs-on: ubuntu-26.04

    steps:
      - uses: actions/checkout@v7

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust
        uses: Swatinem/rust-cache@v2

      - name: Install Linux dependencies
        run: |
          sudo apt update
          sudo apt install -y \
            pkg-config \
            libavcodec-dev \
            libavformat-dev \
            libavutil-dev \
            libavfilter-dev \
            libswscale-dev \
            libva-dev \
            libva-drm2 \
            libpipewire-0.3-dev \
            libspa-0.2-dev \
            libclang-dev \
            libavdevice-dev \
            libswresample-dev \
            upx

      - name: Build
        run: cargo b -r

      - name: Upload Artifact
        uses: actions/upload-artifact@v7
        with:
          name: frostclip-linux
          path: target/release/frostclip
          retention-days: 30
  macos:
    runs-on: macos-latest

    steps:
      - uses: actions/checkout@v7
      - name: Build
        run: cargo b -r

      - name: Upload Artifact
        uses: actions/upload-artifact@v7
        with:
          name: frostclip-dev-macos
          path: target/release/frostclip
          retention-days: 7

  release:
    if: startsWith(github.ref, 'refs/tags/')
    needs: build
    runs-on: ubuntu-26.04

    steps:
      - uses: actions/checkout@v7

      - name: Download Artifact
        uses: actions/download-artifact@v7
        with:
          name: frostclip-linux
          path: build

      - name: Upload Release
        uses: softprops/action-gh-release@v3
        with:
          files: build/frostclip-linux
          draft: true
