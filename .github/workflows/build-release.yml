name: Release Build

on:
  push:
    branches:
      - "**"
    tags:
      - "*"
  pull_request:
    branches:
      - "**"

jobs:
  build:
    name: build (${{ matrix.name }})
    runs-on: ${{ matrix.os }}

    strategy:
      fail-fast: false
      matrix:
        include:
          - name: linux
            os: ubuntu-26.04
          - name: macos
            os: macos-latest

    steps:
      - uses: actions/checkout@v7

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust
        uses: Swatinem/rust-cache@v2

      - name: Install dependencies
        shell: bash
        run: |
          case "$RUNNER_OS" in
            Linux)
              sudo apt-get update
              sudo apt-get install -y \
                pkg-config clang libclang-dev \
                libpipewire-0.3-dev libspa-0.2-dev libva-dev \
                libavcodec-dev libavformat-dev libavutil-dev libavfilter-dev \
                libavdevice-dev libswscale-dev libswresample-dev \
                libx264-dev
              ;;
            macOS)
              brew install ffmpeg@8 pkg-config
              ;;
          esac

      - name: Show ffmpeg version
        run: pkg-config --modversion libavcodec

      - name: Build
        run: cargo b -r

      - name: Package
        shell: bash
        run: cp target/release/frostclip frostclip-${{ matrix.name }}

      - name: Upload Artifact
        uses: actions/upload-artifact@v7
        with:
          name: frostclip-${{ matrix.name }}
          path: frostclip-${{ matrix.name }}
          retention-days: 30

  release:
    if: startsWith(github.ref, 'refs/tags/')
    needs: build
    runs-on: ubuntu-26.04
    permissions:
      contents: write

    steps:
      - name: Download Artifacts
        uses: actions/download-artifact@v7
        with:
          pattern: frostclip-*
          merge-multiple: true
          path: build

      - name: Upload Release
        uses: softprops/action-gh-release@v3
        with:
          files: build/*
          draft: true
