name: Release Build

on:
  push:
    tags:
      - "*"

jobs:
  release:
    strategy:
      matrix:
        include:
          - os: windows-latest
            just-target: windows-release
            artifact: build/frostclip-windows.exe
            name: frostclip-windows

          - os: ubuntu-latest
            just-target: linux-release
            artifact: build/frostclip-linux
            name: frostclip-linux

          - os: macos-latest
            just-target: mac-release
            artifact: build/frostclip-mac
            name: frostclip-mac

    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v7

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust
        uses: Swatinem/rust-cache@v2

      - name: Install Just
        uses: extractions/setup-just@v4

      - name: Install Linux dependencies
        if: matrix.os == 'ubuntu-latest'
        run: |
          sudo apt update
          sudo apt install -y \
            pkg-config \
            libavcodec-dev \
            libavformat-dev \
            libavutil-dev \
            libavfilter-dev \
            libswscale-dev \
            libva-dev \
            libva-drm2 \
            upx

      - name: Build
        run: just ${{ matrix.just-target }}

      - name: Upload Artifact
        uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.name }}
          path: ${{ matrix.artifact }}
          retention-days: 30

      - name: Upload Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v3
        with:
          files: ${{ matrix.artifact }}
          draft: true
