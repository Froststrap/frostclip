[package]
name = "frostclip"
version = "0.0.1"
edition = "2024"

[dependencies]
dirs = "6.0"
toml = "1.1.4"

ffmpeg-sys-next = "8.1"
ffmpeg-next = "8.1"
tracing = "0.1.44"

pipewire = "0.10"
libspa = "0.10"

[dependencies.ashpd]
version = "0.13.13"
features = ["screencast", "tokio"]

[dependencies.tokio]
version = "1.53.1"
features = ["rt"]

[dependencies.logging_subscriber]
git = "https://gitlab.com/invra/logging_subscriber"

[dependencies.chrono]
version = "0.4.45"
default-features = false
features = [
  "std",
  "clock",
]

[dependencies.serde]
version = "1.0.229"
features = ["derive"]
