[workspace]
resolver = "3"
members = [
  "config",
  "frostclip"
]
default-members = ["frostclip"]

[workspace.package]
version = "0.0.1"
edition = "2024"
license = "GPL-3.0"
authors = [
  "UltimatePlayer97 <gogole.help134@gmail.com>",
  "Invra <identificationsucks@gmail.com>",
]

[profile.dev]
opt-level = 1

[workspace.dependencies]
dirs = "6.0"
ffmpeg-next = "8.1"
ffmpeg-sys-next = "8.1"
wayland-client = "0.31"
libc = "0.2"
toml = "1.1.4"
tracing = "0.1.44"
objc2 = "0.6"
objc2-foundation = "0.3"
objc2-screen-capture-kit = "0.3"
objc2-core-media = "0.3"
objc2-video-toolbox = "0.3"
objc2-core-video = "0.3"
objc2-core-foundation = "0.3"
objc2-core-graphics = "0.3"
block2 = "0.6"
dispatch2 = "0.3"

[workspace.dependencies.config]
path = "config"

[workspace.dependencies.ashpd]
version = "0.13.13"
features = ["screencast", "tokio"]

[workspace.dependencies.chrono]
version = "0.4.45"
default-features = false
features = ["std", "clock"]

[workspace.dependencies.pipewire]
version = "0.10"
features = ["v0_3_33"]

[workspace.dependencies.logging-subscriber]
version = "1.1"
git = "https://gitlab.com/invra/logging_subscriber"

[workspace.dependencies.serde]
version = "1.0.229"
features = ["derive"]

[workspace.dependencies.tokio]
version = "1.53.1"
features = ["rt", "time", "macros", "rt-multi-thread", "signal"]

[workspace.dependencies.wayland-protocols]
version = "0.32"
features = ["client", "unstable"]
