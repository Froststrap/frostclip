[package]
name = "frostclip"
version = "0.0.1"
edition = "2024"

[dependencies]
ffmpeg-next = "8.1"
ffmpeg-sys-next = "8.1"
libc = "0.2"
log = "0.4"
env_logger = "0.11"
chrono = { version = "0.4.45", default-features = false, features = [
  "std",
  "clock",
] }
serde_json = "1.0"

tokio = { version = "1.53", default-features = false, features = [
  "rt-multi-thread",
  "macros",
  "sync",
  "time",
] }
futures = "0.3.33"
xcap = "0.9.7"

[build-dependencies]
cc = "1.3"
