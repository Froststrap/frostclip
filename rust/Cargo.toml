[package]
name = "frostclip"
version = "0.0.1"
edition = "2024"

[lib]
crate-type = ["cdylib", "rlib"]

[[bin]]
name = "test"
path = "src/bin/test.rs"

[dependencies]
ffmpeg-next = "8.1"
anyhow = "1.0"
libc = "0.2"
log = "0.4"
env_logger = "0.11"
chrono = { version = "0.4.45", default-features = false, features = ["std", "clock"] }
serde_json = "1.0"
ashpd = { version = "0.13", features = ["screencast"] }
pipewire = "0.10"

tokio = { version = "1.53", default-features = false, features = ["rt-multi-thread", "macros", "sync", "time"] }
futures = "0.3.33"

[build-dependencies]
cc = "1.3"
